<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e3a44"/>
      <stop offset="60%" stop-color="#05181d"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="nk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#82d5e5"/>
      <stop offset="100%" stop-color="#1f5f6e"/>
    </linearGradient>
    <linearGradient id="tu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8829a"/>
      <stop offset="100%" stop-color="#5e1f31"/>
    </linearGradient>
    <linearGradient id="ab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8ecf7"/>
      <stop offset="100%" stop-color="#4fb8cc"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#glow)"/>

  <!-- NK cell (left) -->
  <circle cx="220" cy="260" r="120" fill="url(#nk)" opacity="0.25" filter="url(#soft)"/>
  <circle cx="220" cy="260" r="100" fill="url(#nk)" opacity="0.9"/>
  <ellipse cx="220" cy="240" rx="60" ry="22" fill="#12333b" opacity="0.35"/>
  <ellipse cx="230" cy="300" rx="50" ry="18" fill="#0b2a30" opacity="0.5"/>
  <g fill="#d9f6fc">
    <circle cx="176" cy="272" r="7" opacity="0.9"/>
    <circle cx="196" cy="300" r="6" opacity="0.8"/>
    <circle cx="250" cy="282" r="7" opacity="0.9"/>
    <circle cx="238" cy="320" r="6" opacity="0.8"/>
    <circle cx="196" cy="240" r="6" opacity="0.8"/>
  </g>
  <text x="220" y="180" text-anchor="middle" fill="#e8fbff" font-size="17" font-weight="bold">سلول NK</text>
  <text x="220" y="200" text-anchor="middle" fill="#9adbe8" font-size="13">گیرنده FcγRIIIa (CD16a)</text>

  <!-- Tumor cell (right) lysing -->
  <circle cx="980" cy="260" r="115" fill="url(#tu)" opacity="0.25" filter="url(#soft)"/>
  <circle cx="980" cy="260" r="95" fill="url(#tu)" opacity="0.9"/>
  <ellipse cx="960" cy="235" rx="55" ry="20" fill="#3d1420" opacity="0.4"/>
  <g fill="#ffd9e2" opacity="0.8">
    <circle cx="940" cy="290" r="6"/>
    <circle cx="1000" cy="240" r="5"/>
    <circle cx="1015" cy="295" r="6"/>
  </g>
  <!-- lysis fragments -->
  <g fill="#e8829a" opacity="0.7">
    <circle cx="1120" cy="180" r="7"/>
    <circle cx="1140" cy="230" r="5"/>
    <circle cx="1110" cy="300" r="6"/>
    <circle cx="1135" cy="350" r="4"/>
  </g>
  <text x="980" y="170" text-anchor="middle" fill="#ffe3ea" font-size="17" font-weight="bold">سلول توموری HER2+</text>
  <text x="980" y="190" text-anchor="middle" fill="#e8a5b5" font-size="13">در حال لیز (تخریب)</text>

  <!-- Antibodies bridging -->
  <g>
    <!-- antibody 1 -->
    <g transform="rotate(-24 520 200)">
      <rect x="498" y="150" width="42" height="80" rx="21" fill="url(#ab)"/>
      <rect x="490" y="228" width="46" height="80" rx="23" fill="url(#ab)"/>
      <rect x="497" y="200" width="30" height="34" rx="11" fill="url(#ab)"/>
    </g>
    <!-- antibody 2 -->
    <g transform="rotate(20 640 230)">
      <rect x="620" y="180" width="40" height="76" rx="20" fill="url(#ab)"/>
      <rect x="612" y="254" width="44" height="76" rx="22" fill="url(#ab)"/>
      <rect x="619" y="228" width="28" height="32" rx="11" fill="url(#ab)"/>
    </g>
  </g>

  <!-- dashed signaling arrows -->
  <line x1="330" y1="210" x2="480" y2="220" stroke="#82d5e5" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
  <line x1="700" y1="260" x2="860" y2="280" stroke="#e8829a" stroke-width="2" stroke-dasharray="7 6" opacity="0.7"/>
  <text x="405" y="180" text-anchor="middle" fill="#9adbe8" font-size="13">اتصال Fc به FcγRIIIa</text>
  <text x="790" y="240" text-anchor="middle" fill="#e8a5b5" font-size="13">اتصال Fab به HER2</text>

  <text x="600" y="470" text-anchor="middle" fill="#e8fbff" font-size="16" font-weight="bold">مکانیسم ADCC: آنتیبادی بین سلول NK و سلول توموری پل میزند</text>
  <text x="600" y="494" text-anchor="middle" fill="#7fb6c2" font-size="13">سمت چپ: Fc آنتیبادی به گیرنده FcγRIIIa سلول NK — سمت راست: Fab به HER2 سلول توموری</text>
</svg>
